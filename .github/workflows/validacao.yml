name: validacao
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pacote local e teste de pacote
        run: |
          npm run dist:dir
          npm run test:pacote
