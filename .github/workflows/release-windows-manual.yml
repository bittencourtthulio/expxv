name: release-windows-manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que receberá o instalador'
        required: true
        type: string

jobs:
  empacotar:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist-app/*.exe
            dist-app/latest*.yml
          draft: true
